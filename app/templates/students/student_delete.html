{% extends 'base.html' %}

{% block title %}Eliminar estudiante | Gestor de Tutorías{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="content-card text-center">
            <span class="hero-badge">Eliminar</span>
            <h1 class="dashboard-title mt-3">
                ¿Eliminar estudiante?
            </h1>

            <p class="dashboard-text mt-3">
                {{ estudiante.nombres }} {{ estudiante.apellidos }}
            </p>

            <form method="post" class="mt-4">
                {% csrf_token %}

                <div class="d-flex justify-content-center gap-2 flex-wrap">
                    <button type="submit" class="danger-action-btn">
                        Eliminar
                    </button>

                    <a href="{% url 'students:list' %}" class="secondary-action-btn">
                        Volver al listado
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
